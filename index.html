<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eagle Creek Golf Club</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">

      <a class="site-header__logo" href="/" aria-label="Stay and Play home">
        <img src="/assets/logo.svg" alt="logo icon">
        Stay&amp;Play
      </a>
      <div class="site-header-options">

        <nav class="site-header__nav" aria-label="Primary navigation">
          <ul class="site-header__menu">
            <li class="site-header__item">
              <a class="site-header__link" href="#">
                Home
              </a>
            </li>
            <li class="site-header__item">
              <a class="site-header__link" href="#">
                Where to Stay
              </a>
            </li>
            <li class="site-header__item">
              <a class="site-header__link" href="#">
                Things to Play
              </a>
            </li>
            <li class="site-header__item">
              <a class="site-header__link" href="#">
                Group Travel
              </a>
            </li>
            <li class="site-header__item">
              <a class="site-header__link" href="#">
                Travel Blog
              </a>
            </li>
          </ul>
        </nav>

        <div class="site-header__actions">

          <a class="site-header__book-button" href="#">
            <span class="site-header__book-label">
              Book a Tee Time
            </span>
            <img class="site-header__book-icon" src="assets/golf.svg" alt="">
          </a>

          <button class="site-header__search" type="button" aria-label="Search">
            <span class="site-header__search-label">Search</span>
            <img src="assets/search.svg" alt="">
          </button>

          <button class="site-header__menu-button" type="button" aria-label="Open navigation menu"
            aria-expanded="false">
            <img src="assets/menu.svg" alt="">
          </button>

        </div>
      </div>
    </div>
  </header>
  <nav class="breadcrumb-trail" aria-label="Breadcrumb">
    <a href="#">Golf Course</a>
    <span aria-hidden="true">&gt;</span>
    <a href="#">Florida</a>
    <span aria-hidden="true">&gt;</span>
    <a href="#">Orlando</a>
    <span aria-hidden="true">&gt;</span>
    <span aria-current="page">Eagle Creek Golf Club</span>
  </nav>
  <section class="course-hero">
    <h1 class="course-hero__title" id="course-title">
      Eagle Creek Golf Club, Stay and Play
    </h1>
    <div class="course-hero__meta">
      <span class="course-hero__rating">
        <span aria-hidden="true">★★★★</span>
        <span class="course-hero__rating-empty" aria-hidden="true">★</span>
      </span>

      <span class="course-hero__score">9.0</span>
      <span class="course-hero__reviews">(3 REVIEWS)</span>

      <span class="course-hero__divider" aria-hidden="true">|</span>

      <span class="course-hero__tee-times">
        <span class="course-hero__clock" aria-hidden="true">◷</span>
        TEE TIMES DAILY 7 AM – 6 PM
      </span>
    </div>

  </section>
</body>

</html>
